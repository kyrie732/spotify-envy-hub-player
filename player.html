<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Envy Hub Song Player</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#000;--panel:#121212;--card:#181818;--hover:#282828;--text:#fff;--muted:#a7a7a7;--accent:#1ed760}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Manrope,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:grid;grid-template-columns:240px 1fr;grid-template-rows:1fr 90px;gap:8px;padding:8px}
  aside{background:var(--panel);border-radius:8px;padding:24px 16px;display:flex;flex-direction:column;gap:18px}
  .logo{font-weight:800;font-size:22px;letter-spacing:-.5px}.logo span{color:var(--accent)}
  .nav a{display:flex;gap:12px;color:var(--muted);text-decoration:none;font-weight:600;padding:8px 0;cursor:pointer}
  .nav a:hover,.nav a.active{color:var(--text)}
  .lib{margin-top:10px;color:var(--muted);font-size:13px;font-weight:600}
  #liked{overflow:auto;flex:1;display:flex;flex-direction:column;gap:6px}
  #liked div{font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #liked div:hover{color:var(--text)}
  main{background:linear-gradient(#1f1f1f,var(--panel) 300px);border-radius:8px;overflow:auto;padding:20px 28px}
  .search{display:flex;align-items:center;gap:10px;background:#242424;border-radius:500px;padding:12px 20px;max-width:420px;border:2px solid transparent}
  .search:focus-within{border-color:var(--text)}
  .search input{background:none;border:none;outline:none;color:var(--text);font:inherit;font-size:15px;width:100%}
  h2{margin:28px 0 16px;font-size:24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
  .card{background:var(--card);padding:14px;border-radius:8px;cursor:pointer;transition:.25s;position:relative}
  .card:hover{background:var(--hover)}
  .card img{width:100%;aspect-ratio:1;border-radius:6px;object-fit:cover;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .card .t{font-weight:700;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .a{color:var(--muted);font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .play-fab{position:absolute;right:22px;top:calc(100% - 110px);width:46px;height:46px;border-radius:50%;background:var(--accent);color:#000;border:none;font-size:18px;opacity:0;transform:translateY(8px);transition:.25s;box-shadow:0 8px 16px rgba(0,0,0,.4);cursor:pointer}
  .card:hover .play-fab{opacity:1;transform:none}
  .card.playing .t{color:var(--accent)}
  footer{grid-column:1/-1;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 16px}
  .now{display:flex;gap:14px;align-items:center;min-width:0}
  .now img{width:56px;height:56px;border-radius:4px;background:var(--hover)}
  .now .t{font-weight:700;font-size:14px}.now .a{color:var(--muted);font-size:12px}
  .heart{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}.heart.on{color:var(--accent)}
  .ctrl{display:flex;flex-direction:column;align-items:center;gap:8px}
  .btns{display:flex;gap:22px;align-items:center}
  .btns button{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
  .btns button:hover{color:var(--text)}
  .btns #pp{background:var(--text);color:#000;width:36px;height:36px;border-radius:50%;font-size:14px}
  .bar{display:flex;gap:10px;align-items:center;width:100%;max-width:560px;font-size:11px;color:var(--muted)}
  input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:4px;background:#4d4d4d;cursor:pointer;accent-color:var(--accent)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--text)}
  .vol{display:flex;justify-content:flex-end;align-items:center;gap:8px}.vol input{width:110px}
  .empty{color:var(--muted);margin-top:30px}
  @media(max-width:760px){body{grid-template-columns:1fr}aside{display:none}footer{grid-template-columns:1fr 1fr}.vol{display:none}}
</style>
</head>
<body>
<aside>
  <div class="logo">Envy <span>Hub</span></div>
  <div class="nav">
    <a class="active" onclick="search('top hits')">🏠 Home</a>
    <a onclick="document.getElementById('q').focus()">🔍 Search</a>
  </div>
  <div class="lib">❤ LIKED SONGS</div>
  <div id="liked"></div>
</aside>

<main>
  <div class="search">🔍<input id="q" placeholder="What do you want to play?" autocomplete="off"></div>
  <h2 id="title">Trending now</h2>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <div class="now">
    <img id="nImg" alt="">
    <div style="min-width:0"><div class="t" id="nT">Envy Hub Song Player</div><div class="a" id="nA">Pick a song</div></div>
    <button class="heart" id="heart">♡</button>
  </div>
  <div class="ctrl">
    <div class="btns">
      <button id="shuf" title="Shuffle">🔀</button>
      <button id="prev">⏮</button>
      <button id="pp">▶</button>
      <button id="next">⏭</button>
      <button id="rep" title="Repeat">🔁</button>
    </div>
    <div class="bar"><span id="cur">0:00</span><input type="range" id="seek" value="0" min="0" max="100" step="0.1"><span id="dur">0:30</span></div>
  </div>
  <div class="vol">🔊<input type="range" id="vol" min="0" max="1" step="0.01" value="0.8"></div>
</footer>

<audio id="audio"></audio>
<script>
const $=id=>document.getElementById(id), audio=$('audio');
let list=[], idx=-1, shuffle=false, repeat=false;
let liked=JSON.parse(localStorage.getItem('envyLiked')||'[]');
audio.volume=.8;

function jsonp(url){return new Promise((ok,no)=>{const cb='cb'+Date.now()+Math.floor(Math.random()*1e4);const sc=document.createElement('script');const t=setTimeout(()=>{cleanup();no('timeout')},10000);function cleanup(){clearTimeout(t);delete window[cb];sc.remove()}window[cb]=d=>{cleanup();ok(d)};sc.onerror=()=>{cleanup();no('err')};sc.src=url+'&callback='+cb;document.head.appendChild(sc)})}
const HITS=["Blinding Lights The Weeknd","Espresso Sabrina Carpenter","Die With A Smile Lady Gaga Bruno Mars","APT. ROSE Bruno Mars","Birds of a Feather Billie Eilish","Not Like Us Kendrick Lamar","Flowers Miley Cyrus","Cruel Summer Taylor Swift","As It Was Harry Styles","Shape of You Ed Sheeran","Starboy The Weeknd","Levitating Dua Lipa","Stay The Kid LAROI Justin Bieber","God's Plan Drake","Sunflower Post Malone","Good 4 U Olivia Rodrigo","Heat Waves Glass Animals","Calm Down Rema Selena Gomez","Kill Bill SZA","Peaches Justin Bieber","Lose Yourself Eminem","Bad Guy Billie Eilish","Anti-Hero Taylor Swift","Watermelon Sugar Harry Styles"];
async function getSongs(term,limit){
  const q=encodeURIComponent(term);
  try{const r=await fetch(`/api/search?term=${q}&limit=${limit}`);if(r.ok){const d=await r.json();if(d.results&&d.results.length)return d.results}}catch(e){}
  try{const d=await jsonp(`https://itunes.apple.com/search?term=${q}&media=music&entity=song&limit=${limit}`);const x=d.results.filter(s=>s.previewUrl);if(x.length)return x}catch(e){}
  try{const d=await jsonp(`https://api.deezer.com/search?q=${q}&limit=${limit}&output=jsonp`);return (d.data||[]).filter(s=>s.preview).map(s=>({trackName:s.title,artistName:s.artist.name,artworkUrl100:s.album.cover_medium,previewUrl:s.preview}))}catch(e){}
  return [];
}
async function trending(){
  $('title').textContent='Trending now';$('grid').innerHTML='<p class="empty">Loading...</p>';
  const res=await Promise.all(HITS.map(q=>getSongs(q,1).then(r=>r[0]).catch(()=>null)));
  list=res.filter(s=>s&&s.previewUrl);render();
}
async function search(term){
  if(term==='top hits') return trending();
  $('title').textContent = term==='top hits' ? 'Trending now' : `Results for "${term}"`;
  $('grid').innerHTML='<p class="empty">Loading...</p>';
  try{
    list=await getSongs(term,40);
    render();
  }catch(e){$('grid').innerHTML='<p class="empty">Could not load songs. Try again.</p>'}
}

function render(){
  if(!list.length){$('grid').innerHTML='<p class="empty">No songs found.</p>';return}
  $('grid').innerHTML=list.map((s,i)=>`
    <div class="card ${i===idx?'playing':''}" onclick="play(${i})">
      <img src="${(s.artworkUrl100||'').replace('100x100','300x300')}" alt="">
      <button class="play-fab">▶</button>
      <div class="t">${s.trackName}</div><div class="a">${s.artistName}</div>
    </div>`).join('');
}

function play(i){
  idx=i; const s=list[i];
  audio.src=s.previewUrl; audio.play();
  $('nImg').src=s.artworkUrl100; $('nT').textContent=s.trackName; $('nA').textContent=s.artistName;
  updateHeart(); render();
}

function next(){ if(!list.length)return; play(shuffle?Math.floor(Math.random()*list.length):(idx+1)%list.length) }
function prev(){ if(!list.length)return; if(audio.currentTime>3){audio.currentTime=0;return} play((idx-1+list.length)%list.length) }
const fmt=t=>isNaN(t)?'0:00':`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;

$('pp').onclick=()=>{ if(idx<0&&list.length) return play(0); audio.paused?audio.play():audio.pause() };
$('next').onclick=next; $('prev').onclick=prev;
$('shuf').onclick=()=>{shuffle=!shuffle;$('shuf').style.color=shuffle?'var(--accent)':''};
$('rep').onclick=()=>{repeat=!repeat;$('rep').style.color=repeat?'var(--accent)':''};
audio.onplay=()=>$('pp').textContent='⏸';
audio.onpause=()=>$('pp').textContent='▶';
audio.onended=()=>repeat?(audio.currentTime=0,audio.play()):next();
audio.ontimeupdate=()=>{ $('cur').textContent=fmt(audio.currentTime); $('dur').textContent=fmt(audio.duration); if(audio.duration)$('seek').value=audio.currentTime/audio.duration*100 };
$('seek').oninput=e=>{ if(audio.duration) audio.currentTime=e.target.value/100*audio.duration };
$('vol').oninput=e=>audio.volume=e.target.value;

function updateHeart(){ const s=list[idx]; const on=s&&liked.some(l=>l.trackId===s.trackId); $('heart').textContent=on?'♥':'♡'; $('heart').classList.toggle('on',on) }
$('heart').onclick=()=>{
  const s=list[idx]; if(!s)return;
  const i=liked.findIndex(l=>l.trackId===s.trackId);
  i>=0?liked.splice(i,1):liked.unshift(s);
  localStorage.setItem('envyLiked',JSON.stringify(liked)); updateHeart(); renderLiked();
};
function renderLiked(){
  $('liked').innerHTML=liked.length?liked.map((s,i)=>`<div onclick="playLiked(${i})">♪ ${s.trackName} — ${s.artistName}</div>`).join(''):'<div>No liked songs yet</div>';
}
function playLiked(i){ list=[...liked]; $('title').textContent='Liked Songs'; play(i) }

let timer; $('q').oninput=e=>{ clearTimeout(timer); const v=e.target.value.trim(); timer=setTimeout(()=>search(v||'top hits'),400) };
document.onkeydown=e=>{ if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();$('pp').click()} };

renderLiked(); search('top hits');
</script>
</body>
</html>
